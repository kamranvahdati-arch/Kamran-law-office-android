name: VOKANO 10.1 scoped validation
on:
  push:
    branches: [codex/v10.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build 10.1 candidate and focused tests
        run: gradle assembleRelease assembleReleaseAndroidTest -PinstrumentedBuildType=release -PallowTestSigning
      - name: Build immutable baseline with upgrade fixture instrumentation
        run: |
          git worktree add /tmp/vokano-baseline e3aa48bec758ef9bce0016fa8618fc48001f6450
          cp app/src/androidTest/java/ir/kamranvahdati/lawoffice/V101UpgradeTest.java /tmp/vokano-baseline/app/src/androidTest/java/ir/kamranvahdati/lawoffice/
          cd /tmp/vokano-baseline
          gradle assembleRelease assembleReleaseAndroidTest -PinstrumentedBuildType=release -PallowTestSigning
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade without uninstall or clear; exercise scoped behavior
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 scripts/test-v101-upgrade.py
      - name: Preserve signing verifier for owner-side existing-key signing
        if: always()
        run: |
          mkdir -p app/build/v101-proof/tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" app/build/v101-proof/tools/apksigner.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VOKANO-10.1-test-candidate-api-${{ matrix.api }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/androidTest/release/*.apk
            app/build/v101-proof/
          retention-days: 30
