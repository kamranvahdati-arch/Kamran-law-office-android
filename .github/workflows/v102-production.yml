name: VOKANO 10.2 original production upgrade
on:
  push:
    branches: [codex/v10.2]
    paths: ['release-validation/v102.json']
permissions:
  contents: read
jobs:
  permanent-upgrade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify original installed 10.1 to same-key 10.2
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 scripts/test-v102-production.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VOKANO-10.2-permanent-proof-api-${{ matrix.api }}
          path: |
            app/build/v102-production-proof/
            candidate102/VOKANO-10.2-release.apk
          retention-days: 90
