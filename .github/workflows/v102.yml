name: VOKANO 10.2 scoped installed-upgrade validation
on:
  push:
    branches: [codex/v10.2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify account policy and unavailable backend contract
        run: |
          mkdir -p app/build/account-contract
          javac -d app/build/account-contract app/src/main/java/ir/kamranvahdati/lawoffice/ProfessionalAccount.java app/src/main/java/ir/kamranvahdati/lawoffice/ProfessionalAccountApi.java app/src/test/java/ir/kamranvahdati/lawoffice/ProfessionalAccountSmokeTest.java
          java -cp app/build/account-contract ir.kamranvahdati.lawoffice.ProfessionalAccountSmokeTest
  clean-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleRelease assembleReleaseAndroidTest -PinstrumentedBuildType=release -PallowTestSigning
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install candidate fresh and verify empty release
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 scripts/test-v102-reinstall.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VOKANO-10.2-clean-reinstall-api-${{ matrix.api }}
          path: app/build/v102-proof/clean-reinstall/
          retention-days: 30
  installed-upgrade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
        baseline:
          - { name: v10, revision: e3aa48bec758ef9bce0016fa8618fc48001f6450 }
          - { name: v101, revision: 3df8fdbdb0f290b5231280aa343e20ba03d7a345 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build candidate and focused instrumentation
        run: gradle assembleRelease assembleReleaseAndroidTest -PinstrumentedBuildType=release -PallowTestSigning
      - name: Build immutable baseline with shared test fixture
        env:
          BASELINE_REVISION: ${{ matrix.baseline.revision }}
        run: |
          git worktree add /tmp/vokano-baseline "$BASELINE_REVISION"
          cp app/src/androidTest/java/ir/kamranvahdati/lawoffice/V102UpgradeTest.java /tmp/vokano-baseline/app/src/androidTest/java/ir/kamranvahdati/lawoffice/
          cd /tmp/vokano-baseline
          gradle assembleRelease assembleReleaseAndroidTest -PinstrumentedBuildType=release -PallowTestSigning
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify installed upgrade and scoped regression
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VOKANO_BASELINE_APK: /tmp/vokano-baseline/app/build/outputs/apk/release/app-release.apk
          VOKANO_BASELINE_TEST_APK: /tmp/vokano-baseline/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          VOKANO_BASELINE_NAME: ${{ matrix.baseline.name }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 scripts/test-v102-upgrade.py
      - name: Preserve verifier for owner-side production signing
        if: always()
        run: |
          mkdir -p app/build/v102-proof/tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" app/build/v102-proof/tools/apksigner.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VOKANO-10.2-test-upgrade-${{ matrix.baseline.name }}-api-${{ matrix.api }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/androidTest/release/*.apk
            app/build/v102-proof/
          retention-days: 30
