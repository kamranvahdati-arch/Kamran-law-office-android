name: Build Android APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Test Jalali deadline math
        run: |
          mkdir -p /tmp/klo-date-test
          javac -d /tmp/klo-date-test app/src/main/java/ir/kamranvahdati/lawoffice/JalaliDate.java app/src/main/java/ir/kamranvahdati/lawoffice/InputValidators.java app/src/test/java/ir/kamranvahdati/lawoffice/DeadlineDateSmokeTest.java app/src/test/java/ir/kamranvahdati/lawoffice/InputValidatorsSmokeTest.java
          java -cp /tmp/klo-date-test ir.kamranvahdati.lawoffice.DeadlineDateSmokeTest
          java -cp /tmp/klo-date-test ir.kamranvahdati.lawoffice.InputValidatorsSmokeTest
      - name: Test authenticated backup frames
        run: |
          mkdir -p /tmp/vokano-backup-test
          javac -d /tmp/vokano-backup-test app/src/main/java/ir/kamranvahdati/lawoffice/BackupCipher.java app/src/test/java/ir/kamranvahdati/lawoffice/BackupCipherSmokeTest.java
          java -cp /tmp/vokano-backup-test ir.kamranvahdati.lawoffice.BackupCipherSmokeTest
      - name: Build test-signed release APK
        run: gradle assembleRelease assemblePreview -PallowTestSigning
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOKANO-10-APK-api-${{ matrix.api }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable hardware acceleration for Android emulator
        if: github.event_name == 'pull_request'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise debug suite and clean release backup on emulator
        if: github.event_name == 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed
            gradle connectedDebugAndroidTest --stacktrace
            cp -R app/build/reports/androidTests app/build/full-test-report
            adb shell wm size 720x1280
            gradle installDebug installDebugAndroidTest
            python3 scripts/run-ui-smoke.py
            adb shell wm size reset
            adb install -r app/build/outputs/apk/preview/app-preview.apk
            adb shell am start -W -n ir.kamranvahdati.lawoffice.preview/ir.kamranvahdati.lawoffice.MainActivity
            adb shell pidof ir.kamranvahdati.lawoffice.preview
            gradle assembleRelease assembleReleaseAndroidTest -PinstrumentedBuildType=release -PallowTestSigning
            adb uninstall ir.kamranvahdati.lawoffice || true
            adb uninstall ir.kamranvahdati.lawoffice.test || true
            adb install app/build/outputs/apk/release/app-release.apk
            adb install app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            python3 scripts/run-production-smoke.py
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-evidence-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/qa
            app/build/full-test-report
            app/build/ui-smoke.txt
            app/build/production-proof
          if-no-files-found: ignore
