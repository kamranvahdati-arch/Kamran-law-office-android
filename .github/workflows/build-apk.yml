name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Test Jalali deadline math
        run: |
          mkdir -p /tmp/klo-date-test
          javac -d /tmp/klo-date-test app/src/main/java/ir/kamranvahdati/lawoffice/JalaliDate.java app/src/test/java/ir/kamranvahdati/lawoffice/DeadlineDateSmokeTest.java
          java -cp /tmp/klo-date-test ir.kamranvahdati.lawoffice.DeadlineDateSmokeTest
      - name: Build release APK
        run: gradle assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kamran-Law-Office-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish simple APK download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Kamran-Law-Office-v0.8.0.apk
          zip -j Kamran-Law-Office-v0.8.0.zip Kamran-Law-Office-v0.8.0.apk
          gh release view latest-preview >/dev/null 2>&1 || gh release create latest-preview --title "نسخه آزمایشی دفتر وکالت" --notes "نسخه آزمایشی عمومی ۰٫۸٫۰، آفلاین با داده‌های کاملاً فرضی و امکانات قرارها، مهلت‌ها، داشبورد تعاملی و گزارش موردی"
          gh release upload latest-preview Kamran-Law-Office-v0.8.0.apk Kamran-Law-Office-v0.8.0.zip --clobber
