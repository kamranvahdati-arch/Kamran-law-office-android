name: Build Android APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Test Jalali deadline math
        run: |
          mkdir -p /tmp/klo-date-test
          javac -d /tmp/klo-date-test app/src/main/java/ir/kamranvahdati/lawoffice/JalaliDate.java app/src/test/java/ir/kamranvahdati/lawoffice/DeadlineDateSmokeTest.java
          java -cp /tmp/klo-date-test ir.kamranvahdati.lawoffice.DeadlineDateSmokeTest
      - name: Build release APK
        run: gradle assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kamran-Law-Office-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Exercise encrypted migration on an emulator
        if: github.event_name == 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed
            adb logcat -c
            gradle connectedDebugAndroidTest --stacktrace || {
              adb logcat -d -v time -t 4000 | grep -E 'AndroidRuntime|FATAL EXCEPTION|Process: ir.kamranvahdati|sqlcipher|zetetic|EncryptedMigrationTest|JUnit' | tail -n 160
              exit 1
            }
      - name: Publish APK plus ZIP
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Kamran-Law-Office-v0.8.1.apk
          zip -j Kamran-Law-Office-v0.8.1.zip Kamran-Law-Office-v0.8.1.apk
          gh release view latest-preview >/dev/null 2>&1 || gh release create latest-preview --title "نسخه آزمایشی دفتر وکالت" --notes "نسخه عمومی آزمایشی؛ فقط داده فرضی. برای محدودیت‌های امنیتی و مهاجرت، AUDIT_V08.md را بخوانید."
          gh release upload latest-preview Kamran-Law-Office-v0.8.1.apk Kamran-Law-Office-v0.8.1.zip --clobber
