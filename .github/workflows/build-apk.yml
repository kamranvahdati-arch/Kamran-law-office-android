name: Build Android APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Test Jalali deadline math
        run: |
          mkdir -p /tmp/klo-date-test
          javac -d /tmp/klo-date-test app/src/main/java/ir/kamranvahdati/lawoffice/JalaliDate.java app/src/main/java/ir/kamranvahdati/lawoffice/InputValidators.java app/src/test/java/ir/kamranvahdati/lawoffice/DeadlineDateSmokeTest.java app/src/test/java/ir/kamranvahdati/lawoffice/InputValidatorsSmokeTest.java
          java -cp /tmp/klo-date-test ir.kamranvahdati.lawoffice.DeadlineDateSmokeTest
          java -cp /tmp/klo-date-test ir.kamranvahdati.lawoffice.InputValidatorsSmokeTest
      - name: Build release APK
        run: gradle assembleRelease assemblePreview
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOKANO-10-APK-api-${{ matrix.api }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable hardware acceleration for Android emulator
        if: github.event_name == 'pull_request'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise encrypted migration on an emulator
        if: github.event_name == 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed
            gradle connectedDebugAndroidTest --stacktrace
            cp -R app/build/reports/androidTests app/build/full-test-report
            adb shell wm size 720x1280
            gradle installDebug installDebugAndroidTest
            python3 scripts/run-ui-smoke.py
            adb shell wm size reset
            adb install -r app/build/outputs/apk/preview/app-preview.apk
            adb shell am start -W -n ir.kamranvahdati.lawoffice.preview/ir.kamranvahdati.lawoffice.MainActivity
            adb shell pidof ir.kamranvahdati.lawoffice.preview
      - name: Verify same-package upgrade from populated 9.1
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin codex/v091-deadlines-audit
          git worktree add --detach "$RUNNER_TEMP/v091" FETCH_HEAD
          gradle -p "$RUNNER_TEMP/v091" assembleRelease assembleDebugAndroidTest
          adb uninstall ir.kamranvahdati.lawoffice || true
          adb install "$RUNNER_TEMP/v091/app/build/outputs/apk/release/app-release.apk"
          adb install "$RUNNER_TEMP/v091/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          adb shell am instrument -w -e class ir.kamranvahdati.lawoffice.ScheduleMigrationTest#editingSessionDetailsPreservesTimeAndRemindersAndRejectsUnrelatedClient ir.kamranvahdati.lawoffice.test/ir.kamranvahdati.lawoffice.OfficeTestRunner | tee app/build/upgrade-v091-seed.txt
          grep -q 'OK (1 test)' app/build/upgrade-v091-seed.txt
          adb install -r app/build/outputs/apk/release/app-release.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w -e upgrade_mode true -e class ir.kamranvahdati.lawoffice.VokanoUpgradeTest#samePackageUpgradeRetainsExistingAppointmentAndDatabaseVersion ir.kamranvahdati.lawoffice.test/ir.kamranvahdati.lawoffice.OfficeTestRunner | tee app/build/upgrade-v10-result.txt
          grep -q 'OK (1 test)' app/build/upgrade-v10-result.txt
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-evidence-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/qa
            app/build/full-test-report
            app/build/ui-smoke.txt
            app/build/upgrade-v091-seed.txt
            app/build/upgrade-v10-result.txt
          if-no-files-found: ignore
